services:
  - type: web
    name: edustream-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/courses
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx350m -XX:+UseSerialGC"
      - key: ADMIN_PASSWORD
        sync: false
